name: Deploy Web OTA Update

on:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Publish Web Bundle to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Build Web Application
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Generate OTA version.json & Package web-dist.zip
        run: |
          # 1. Generate release version metadata with unique increasing build number
          cat <<EOF > web/dist/version.json
          {
            "version": ${{ github.run_number }},
            "gitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "zipUrl": "https://wurzelkuchen.github.io/SimpleLists/web-dist.zip"
          }
          EOF

          # 2. Package bundle into web-dist.zip
          cd web/dist
          zip -r ../../web-dist.zip .
          cd ../..
          mv web-dist.zip web/dist/web-dist.zip

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          keep_files: false
