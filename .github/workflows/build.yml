name: Build and Test Simple Lists

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Web App, Signaling Server & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package.json
            signaling-server/package.json

      - name: Test Signaling Server
        working-directory: ./signaling-server
        run: |
          npm ci
          npm test

      - name: Build Web Application
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Bundle Web Assets into Android
        run: |
          mkdir -p app/src/main/assets/web
          cp -r web/dist/* app/src/main/assets/web/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-lists-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
