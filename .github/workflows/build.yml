name: Build and Test Simple Lists

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Web App, Signaling Server & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package.json
            signaling-server/package.json

      - name: Test Signaling Server
        working-directory: ./signaling-server
        run: |
          npm ci
          npm test

      - name: Build Web Application
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Bundle Web Assets into Android
        run: |
          VERSION=$(git log -1 --format=%ct)
          cat <<EOF > web/dist/version.json
          {
            "version": $VERSION,
            "gitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "zipUrl": "https://wurzelkuchen.github.io/SimpleLists/web-dist.zip?v=$VERSION"
          }
          EOF
          mkdir -p app/src/main/assets/web
          cp -r web/dist/* app/src/main/assets/web/

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --no-daemon --no-build-cache --refresh-dependencies --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-lists-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
